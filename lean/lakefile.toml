name = "oocert"
version = "0.1.0"
defaultTargets = ["OOCert", "oo-cert", "oo-horn", "Shacl", "oo-shacl", "oo-refute", "Dl", "oo-dlmodel", "Fol", "oo-folmodel", "Institution"]

# Every library and executable here is in defaultTargets on purpose. A target
# left out of the default set is not built by a bare `lake build`, which is what
# the CI job runs, so its proofs can fail to compile while the gate reports
# success. That happened once, on 14 September 2026: the SHACL layer did not
# compile at the commit that carried it and CI was green over it, because
# `Shacl` was not a default target. Anything added here must be added there.
#
# Core Lean only. No Mathlib, no external packages: the checker's trust surface
# is the Lean kernel plus what is written in this directory, and it should stay
# small enough to read in an afternoon.

[[lean_lib]]
name = "OOCert"

[[lean_exe]]
name = "oo-cert"
root = "Main"

[[lean_exe]]
name = "oo-horn"
root = "HMain"

# SHACL Core, mechanised. Separate from `OOCert` on purpose: the derivation
# checker never looks inside a term and this one has to, so the two keep their
# own term modules and neither can break the other's build.
[[lean_lib]]
name = "Shacl"
roots = ["Shacl.All"]
globs = ["Shacl.+"]

[[lean_exe]]
name = "oo-shacl"
root = "ShaclMain"

# The refutation checker. `oo-refute/1` is a second certificate format: a
# derivation prefix plus one step that concludes contradiction rather than a
# triple. Its own executable because its verdict is a different sentence from
# `oo-cert`'s, and the two must never be confused for one another.
[[lean_exe]]
name = "oo-refute"
root = "RefuteMain"

[[lean_lib]]
name = "Dl"

[[lean_exe]]
name = "oo-dlmodel"
root = "DlMain"

# The first-order model certificate. A solver's `sat` answer plus the finite
# structure it built, checked against the problem it was given. Separate from
# `Dl` on purpose and NOT built on it: `Dl.Sat` evaluates at one free variable
# over a carrier given as a list of names, `Fol.eval` threads an environment
# over a carrier that is a type, and `Dl.WellFormed` would make `Fol` REJECT
# genuine models. The six reasons are in decision 0006 so that nobody
# re-litigates the split in six months.
[[lean_lib]]
name = "Fol"

[[lean_exe]]
name = "oo-folmodel"
root = "FolMain"

# The institution layer: what a logic is, what a translation between two logics
# is, and the satisfaction condition that neither may be built without. A
# separate library from `OOCert` because `Main.lean` imports `OOCert` and this
# has no run-time part: it is theorems over the model classes the other
# libraries already define, it pulls in `Fol`, and no executable reads it. In
# defaultTargets, like everything else here, for the reason at the top of this
# file.
[[lean_lib]]
name = "Institution"
