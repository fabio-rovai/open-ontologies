name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded branch runs are cancelled; main runs are kept so every commit
# keeps its own status. Three pushes to main landed inside 33 minutes on
# 2026-08-18 and each one started a fresh 6 hour hang.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only, stated here rather than inherited from the repository default,
# which a settings change could widen for every job in this file at once.
# Nothing below writes through the token: uploads and the Actions cache use
# the runner's own credentials.
permissions:
  contents: read

jobs:
  build:
    # 60, not 30. The Windows leg takes 9 to 14 minutes on a warm cache and 30
    # to 35 on a cold or partial one, and the 30-minute ceiling killed it AFTER
    # every step had passed: on 16 October 2026 main (run 38943462546) and the
    # 2.1.0 release PR were reported cancelled while Build, Test, Clippy and
    # Audit were all green and only the rust-cache save was still running.
    # The same happened on main on 13 October. A hung job is still caught.
    timeout-minutes: 60
    # Every Linux job in this file runs on ubuntu-24.04 rather than
    # ubuntu-latest. GitHub moves ubuntu-latest to Ubuntu 26.04 by 19 Nov 2026,
    # which would change the image under all four required checks with no
    # commit here: the apt z3 alone goes from 4.8.12 to 4.13.3, and the Python
    # and Lean toolchain steps have only ever run on 24.04. The image now moves
    # when a commit moves it.
    #
    # The matrix VALUE stays `ubuntu-latest`, mapped to the pinned image here,
    # because it is part of a required check's name, "build (ubuntu-latest)".
    # Renaming it would leave branch protection waiting for a check that never
    # reports, and every pull request would be blocked.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    strategy:
      # Each leg reports its own verdict. Under the default, a failure on one
      # leg cancelled the other: in run 38833090790 (16 Oct 2026) the Windows
      # leg failed and the REQUIRED Linux leg was cancelled in the middle of
      # its tests, so the pull request was blocked by a leg that is not
      # required and had no Linux result at all. In run 39159645271 a Linux
      # failure cancelled the Windows leg and its test signal with it.
      # `features` and release.yml already set this.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/edge
          sudo apt-get clean
          df -h
      # Rust 1.99.1, the version every job here ran on 1 Nov 2026 (run
      # 41357717049), and no longer `@stable`, which installs whatever is newest
      # on the day of the run: 1.100.0 is due on 12 Nov 2026, and a new stable
      # brings clippy lints that `-D warnings` makes errors in this required
      # check. The compiler now moves when a commit moves it, in every workflow
      # and the Dockerfile together; scripts/check-toolchain-pins.sh, run by the
      # `paths` job, fails a partial bump, and canary.yml shows when the next
      # version is safe to move to.
      #
      # The action is pinned to master's commit and given the version as
      # `toolchain:`. Its `1.99.1` branch would not take that input: the version
      # branches hard-code their version, and each is regenerated as a new commit
      # whenever master moves (all of them on 16 Oct 2026).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Save the build cache even when the job fails. The default discards
          # it, and these jobs fail most often on a lint or a single test leg
          # that runs AFTER everything is compiled, so the default threw away
          # the expensive half of the work and made every fix-and-retry pay for
          # it again. Measured on 18 September 2026: two branches failed clippy
          # after a full build, and the lean job rebuilt a release binary from
          # cold for twelve minutes on a rerun that changed one line.
          cache-on-failure: true
          # Only main saves, here and in every rust-cache step below. Main's own
          # entries filled 9.2 of the repository's 10 GB Actions cache on 1 Nov
          # 2026. A pull request that leaves Cargo.toml and Cargo.lock as main
          # has them restores main's entry and has nothing to save; one that
          # changes either, or runs before main has saved, wrote a copy only it
          # could read, and that evicted main's. On 2 Nov, 3.7 of the 9.8 GB in
          # use were #359's copies of four keys main also held. The cost is that
          # such a pull request rebuilds its changes on each push.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        # --locked: a Cargo.lock that does not match Cargo.toml fails here. Without
        # it cargo re-resolves silently, and CI tests, lints and audits a
        # dependency set nobody committed. One check suffices for every job,
        # because they all build from the same Cargo.lock.
        run: cargo build --locked
      - name: Test
        # `shell: bash` and `set -o pipefail`, and neither is decoration.
        #
        # This step was `cargo test ... | tee cargo-test.log` with no shell named.
        # On Linux a `run:` block is `bash -e`, which does NOT set pipefail, so the
        # step's exit status was TEE's and never cargo's, and the whole suite could
        # report `test result: FAILED` under a green tick. Measured, not reasoned:
        # on the first run of this branch the Linux leg passed with a failing test
        # in its own log while the Windows leg, whose default shell is PowerShell
        # and which therefore keeps cargo's exit code, failed on the same test.
        # A job that runs every test and cannot fail on one is the same defect this
        # repository keeps finding elsewhere, in the job that runs the most tests.
        #
        # Naming bash makes both legs of the matrix behave the same way, which is
        # the point of running a matrix, and the skip-counter step below already
        # names it for the same reason.
        shell: bash
        run: |
          set -o pipefail
          cargo test -- --nocapture 2>&1 | tee cargo-test.log
      - name: Report tests that skipped for a missing fixture
        # Some tests need data this repository does not carry, so they skip
        # rather than fail. A skip reports `ok`, which means a green run can
        # hide a suite that quietly shrank. This does not fail the build; it
        # prints the count and the names so a shrinking suite is visible in the
        # log instead of invisible in a pass. tests/common/mod.rs emits the
        # marker, and OO_REQUIRE_FIXTURES=1 turns each skip into a failure for
        # any job that is supposed to supply the fixtures.
        #
        # `shell: bash` because the matrix includes Windows, where a `run:`
        # block defaults to PowerShell and this one is a bash script. It failed
        # the whole Windows leg on the line it was written to be harmless on,
        # contradicting the "does not fail the build" above. The runner ships
        # bash, so naming it is the whole fix.
        shell: bash
        run: |
          n=$(grep -c 'SKIPPED_FIXTURE:' cargo-test.log || true)
          echo "$n test(s) skipped for a missing fixture"
          grep 'SKIPPED_FIXTURE:' cargo-test.log | sort -u || true
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Audit
        # Linux only. `cargo audit` reads Cargo.lock, which is the same file on
        # both legs, so the Windows run reported nothing the Linux run had not,
        # and it spent six minutes compiling cargo-audit from source to do it.
        #
        # On a pull request it fails only on an advisory the change brings in:
        # the base branch's Cargo.lock is audited the same way and the two are
        # compared by (advisory, crate, version). An advisory published against
        # a dependency main already has is on both sides, so it is printed as a
        # warning here, and it fails main's own audit on the next push and in
        # the daily run in audit.yml. It no longer turns every open pull request
        # red: in October 2026 four advisory batches did, in 12 of the 15 pull
        # request runs that failed, on changes that touched no dependency
        # (#317 and #328 among them). A push to main still fails on any
        # advisory.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # --locked installs cargo-audit with its own published Cargo.lock.
          # Without it cargo resolves transitive deps to latest, and
          # tinyvec 1.13.0 no longer compiles on current stable
          # ("`vec` is imported here, but it is a module, not a macro"),
          # so the audit step fails for a reason unrelated to this repo.
          cargo install cargo-audit --locked
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            cargo audit
            exit 0
          fi
          cargo audit || true
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:Cargo.lock > "$RUNNER_TEMP/base.lock"
          cargo audit --json > "$RUNNER_TEMP/head.json" || true
          cargo audit --json --file "$RUNNER_TEMP/base.lock" > "$RUNNER_TEMP/base.json" || true
          python3 scripts/audit-new-advisories.py "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"

  # Windows is the only leg that rejects an unrepresentable path, and it rejects
  # it inside actions/checkout, before a line is compiled: `benchmark/lubm\Uni-
  # versity0_0.owl` is one file on Linux and macOS and an invalid path on
  # Windows, so git exits 128 and cancels the rest of the matrix. That is how
  # 190 generated LUBM files rode in on #100 while every local `git status`
  # stayed clean and the failure surfaced as an unexplained build break. This
  # job names the offending paths in seconds.
  paths:
    timeout-minutes: 10
    name: paths / windows-safe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject paths Windows cannot check out
        run: |
          bad=$(git ls-files -z | tr '\0' '\n' \
            | grep -Ei '\\|[:?*<>"|]|[ .]$|(^|/)(con|prn|aux|nul|com[1-9]|lpt[1-9])(\.|$)' || true)
          if [ -n "$bad" ]; then
            echo "Tracked paths that actions/checkout will reject on Windows:"
            echo "$bad"
            exit 1
          fi
          echo "All tracked paths are representable on Windows."
      # In this job because, like the step above, it reads the tree and needs
      # nothing installed, so it reports in seconds. It fails unless every
      # workflow and the Dockerfile name the same Rust version; the script's
      # header says why that matters.
      - name: Every workflow and the Dockerfile pin one Rust version
        run: bash scripts/check-toolchain-pins.sh

  # Optional features are compiled by nothing above: `default = []`, and the
  # three cargo invocations in `build` are bare. A green run there says nothing
  # about postgres, duckdb, sql, embeddings or causal-pywhy, nor about the
  # dependency trees they pull in (sqlx, duckdb, tract-onnx, tokenizers,
  # instant-distance).
  #
  # It is also why eight test files under tests/ had never been collected once.
  # tests/schema_test.rs is gated on `postgres` and covers
  # SchemaIntrospector::sql_to_xsd, which carried a real defect the whole time
  # (#76, fixed in #80): the test existed, and it was dark.
  #
  # Ubuntu only. The bundled duckdb build dominates wall time and Windows would
  # double it for no signal the Linux leg does not already give.
  features:
    timeout-minutes: 45
    name: features / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Breadth: everything compiles and lints, including causal-pywhy,
          # whose Rust side has no dependencies of its own.
          - name: breadth (all-features)
            cache_key: breadth
            flags: --all-features
            test: false
          # Depth: everything whose tests run without external services.
          # causal-pywhy is left out here rather than everywhere — it shells out
          # to Python/DoWhy at runtime, which is a service dependency in all but
          # name. It is still compiled and linted by the breadth leg.
          # `turbovec` belongs in this leg rather than only in the breadth
          # leg, because breadth is `test: false`. Without it here the
          # TurboQuant backend and the text-vector eviction mode are compiled
          # and linted by CI but never once executed by it.
          # `plugins` for the same reason. The in-process WASM host ships in
          # every release binary and in the Docker image, and until this leg
          # named it tests/plugin_host_test.rs collected 0 tests in CI. wasmi is
          # pure Rust and the tests assemble their WAT at run time, so it needs
          # no toolchain or service here.
          - name: depth (postgres,duckdb,embeddings,sql,turbovec,plugins)
            cache_key: depth
            flags: --features postgres,duckdb,embeddings,sql,turbovec,plugins
            test: true
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/edge
          sudo apt-get clean
          df -h
      - name: Install build deps (OpenSSL/libpq)
        # The runner image already ships all three of these, so the common case
        # is a no-op: the step logged "0 upgraded, 0 newly installed" every time
        # it succeeded. Its only real effect was an unconditional network call.
        # On 2026-08-18 the Azure apt mirror went dark, apt fell back to
        # archive.ubuntu.com, stalled mid-transfer, and sat there with no
        # timeout until GitHub killed the job at the 6 hour ceiling (runs
        # 32156117278 and 32157458411, 5h58m of silence after the last Get:).
        # So: touch the network only when something is genuinely missing, and
        # bound apt when it is.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          missing=()
          for p in pkg-config libssl-dev libpq-dev; do
            dpkg -s "$p" >/dev/null 2>&1 || missing+=("$p")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "Build deps already present on the image; skipping apt."
            exit 0
          fi
          echo "Missing build deps: ${missing[*]}"
          sudo apt-get -o Acquire::Retries=3 \
                       -o Acquire::http::Timeout=30 \
                       -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
                       --no-install-recommends "${missing[@]}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Save the build cache even when the job fails. The default discards
          # it, and these jobs fail most often on a lint or a single test leg
          # that runs AFTER everything is compiled, so the default threw away
          # the expensive half of the work and made every fix-and-retry pay for
          # it again. Measured on 18 September 2026: two branches failed clippy
          # after a full build, and the lean job rebuilt a release binary from
          # cold for twelve minutes on a rerun that changed one line.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Keyed per leg: they build disjoint dependency trees, and sharing one
          # cache between them would thrash it on every run. Not `matrix.name` —
          # GitHub rejects cache keys containing commas, and the rejection is a
          # log annotation rather than a failing step, so the leg would keep
          # running uncached and silent.
          key: ${{ matrix.cache_key }}
      - name: Check
        run: cargo check ${{ matrix.flags }} --all-targets
      - name: Clippy
        # --all-targets so the gated tests are linted too. `-D warnings` over
        # code that is never compiled is not a check.
        run: cargo clippy ${{ matrix.flags }} --all-targets -- -D warnings
      - name: Test
        if: matrix.test
        run: |
          set -o pipefail
          cargo test ${{ matrix.flags }} 2>&1 | tee cargo-test.log
      - name: Verify every enabled test file collected tests
        if: matrix.test
        # Same flags as the test step, so the enabled set cannot drift from what
        # was actually built. The script expands them through [features], which
        # a hand-written list would not: `sql` implies postgres + duckdb.
        run: bash scripts/check-test-collection.sh cargo-test.log "${{ matrix.flags }}"

  # The floor Cargo.toml declares as rust-version, measured rather than written
  # down. README.md and CONTRIBUTING.md said Rust 1.85+ until 2 Nov 2026 while
  # the darling 0.23 in Cargo.lock needed 1.88, and nothing could notice. This
  # checks the default features and the release set with exactly that version,
  # and scripts/check-toolchain-pins.sh fails if this job and Cargo.toml stop
  # naming the same one. Not a required check: a dependency update that raises
  # the floor is a decision to make, and this job is where it becomes visible.
  msrv:
    timeout-minutes: 30
    name: msrv (1.88)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the default features on the declared floor
        run: cargo check --locked
      - name: Check the release features on the declared floor
        run: cargo check --locked --features embeddings,plugins

  # The README describes the SHACL validator as differentially tested against
  # pyshacl. tools/shacl_differential.py has existed since August and was
  # referenced by no workflow and no Makefile target, so nothing ran it, no
  # result was ever committed, and the claim rested on a run somebody did once
  # by hand. A verification procedure nobody executes is the same defect as a
  # test that returns early: it reports assurance that did not happen.
  #
  # The oracle exits 1 on a FALSE_CLEAN, meaning we said conforms where pyshacl
  # said not, which is the one failure this validator must never have, and on
  # a planted control it misclassifies. It exits 2, NOT MEASURED, when there is
  # no oracle, the wrong oracle, nothing discovered, fewer pairs run than
  # discovered, or no pair compared. Any non-zero exit fails this job.
  # Disagreements in the other direction and undetermined verdicts are printed
  # and uploaded, not failed on, because they are a work list rather than a
  # defect.
  #
  # Before #320 the script exited 0 on everything but a FALSE_CLEAN, and this
  # job was green on a run that compared nothing: measured 24 Oct 2026, the
  # case-studies corpus yields 4 pairs and all 4 are UNDETERMINED. The W3C suite
  # is therefore run in the same invocation, where each disagreement is
  # arbitrated against the Working Group's expected report (73 of 117 pairs
  # compared on that date).
  #
  # pyshacl and rdflib are pinned, and the script refuses (exit 2) any other
  # pyshacl than PYSHACL_VERSION, because an unpinned oracle makes a pyshacl
  # release look like a change in this engine. The versions and the sha256 of
  # every input are in the uploaded JSON.
  shacl-differential:
    timeout-minutes: 30
    name: SHACL differential vs pyshacl
    runs-on: ubuntu-24.04
    env:
      PYSHACL_VERSION: "0.40.1"
      RDFLIB_VERSION: "7.6.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Save the build cache even when the job fails. The default discards
          # it, and these jobs fail most often on a lint or a single test leg
          # that runs AFTER everything is compiled, so the default threw away
          # the expensive half of the work and made every fix-and-retry pay for
          # it again. Measured on 18 September 2026: two branches failed clippy
          # after a full build, and the lean job rebuilt a release binary from
          # cold for twelve minutes on a rerun that changed one line.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # One entry for the two jobs that build the same thing: `cargo build
          # --release` of the default features, here and in `python`. They saved
          # two identical 790 MB entries, and main's own entries alone filled
          # 9.2 of the repository's 10 GB Actions cache on 1 Nov 2026, so any
          # pull request that saved a cache evicted one of main's.
          shared-key: release-default
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install the pinned oracle
        run: pip install "pyshacl==${PYSHACL_VERSION}" "rdflib==${RDFLIB_VERSION}"
      - name: Build the binary the oracle drives
        run: cargo build --release
      - name: Run the differential over the case-study corpus and the W3C suite
        run: |
          python3 tools/shacl_differential.py \
            --discover case-studies \
            --w3c tests/w3c-shacl \
            --pyshacl-version "${PYSHACL_VERSION}" \
            --json shacl-differential.json
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shacl-differential
          path: shacl-differential.json

  # `python/` (open-ontologies-lite) has its own test suite and its own release
  # workflow, and until now nothing ran the tests. `python-release.yml` goes
  # straight from `uv build` to `pypa/gh-action-pypi-publish` on a `py-v*` tag,
  # so every wheel published to PyPI so far was published without its tests
  # having executed once. Same shape of gap as #67, one subpackage over.
  #
  # Kept in CI rather than bolted onto the release workflow: a test that only
  # runs at publish time tells you about the defect after the artefact is
  # public.
  # The job used to install the `dev` extra and nothing else: pytest, and the one
  # base dependency. No cargo build, so no Rust engine. No elan, so no oo-horn.
  # The three-way differential — the Rust engine, the Python engine and the Lean
  # checker over the same documents — ran its preflight, found neither of the two
  # it needs, and skipped every test in the file. `pytest -q` printed an `s` per
  # skip and exited 0, so a green tick on this job said nothing whatsoever about
  # the differential. That is a gate that passes by not running, which is the
  # failure this repository exists to attack, and it was in this repository's own
  # CI.
  #
  # Two things had to change and both are here. The job now BUILDS what the
  # tests need, and `python/tests/conftest.py` makes `OO_REQUIRE_FIXTURES=1` mean
  # on this side what it has meant on the Rust side since `tests/common/mod.rs`:
  # a skip is a failure. The strict leg below names the files whose dependencies
  # this job actually provides, exactly as the `lean` job names its nineteen.
  python:
    # 15 was enough for `pytest -q` on a pure-Python suite. This job now builds
    # `lean/` and a release binary, which is what the `lean` job budgets 45 for.
    timeout-minutes: 45
    # The first leg's displayed name is a REQUIRED CHECK: branch protection
    # waits for exactly "python (open-ontologies-lite)", and a renamed check
    # never reports, so every pull request would wait for it. The string is
    # written out in the matrix and this expression is the whole name. GitHub
    # adds the matrix values in parentheses to a job id, or to a name with no
    # expression in it, as `build` shows "build (ubuntu-latest)", and shows an
    # expression as it evaluates, as `features / ${{ matrix.name }}` shows
    # "features / breadth (all-features)". So leg one shows that string and
    # nothing after it.
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      # The required leg reports its own verdict whatever the other one does.
      fail-fast: false
      matrix:
        include:
          # REQUIRED. Python 3.10, the floor requires-python declares, with
          # every dependency held to python/constraints-ci.txt: the 21 versions
          # this job installed on main in its last three runs (125001267766 on
          # 1 Nov 2026, 125172010941 and 125275316316 on 2 Nov), so a release of
          # pytest, rdflib or numpy no longer changes what this check means.
          # The file's first lines are the uv command that regenerates it.
          - name: python (open-ontologies-lite)
            python: '3.10'
            constraints: '-c constraints-ci.txt'
          # Never required. The newest Python with whatever resolves on the
          # day, so a dependency release that breaks the package shows here
          # first, and in no check that blocks a merge.
          - name: python (open-ontologies-lite, 3.14 latest deps)
            python: '3.14'
            constraints: ''
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The Lean checker, built by the same local action as the `lean` job;
      # building `lean/` is itself the proof check, and it is what puts
      # `oo-horn` at lean/.lake/build/bin/oo-horn, which is where `find_checker`
      # looks. The action pins elan by digest and retries only the toolchain
      # download; .github/actions/lean-build/action.yml says why.
      - name: Build lean/ (the proof check)
        timeout-minutes: 30
        uses: ./.github/actions/lean-build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Save the build cache even when the job fails. The default discards
          # it, and these jobs fail most often on a lint or a single test leg
          # that runs AFTER everything is compiled, so the default threw away
          # the expensive half of the work and made every fix-and-retry pay for
          # it again. Measured on 18 September 2026: two branches failed clippy
          # after a full build, and the lean job rebuilt a release binary from
          # cold for twelve minutes on a rerun that changed one line.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Shared with `shacl-differential`, which builds the same --release
          # binary; the comment there has the numbers.
          shared-key: release-default
      # --release, not debug: tools/horn_differential.py looks for
      # target/release/open-ontologies and falls back only to PATH.
      - name: Build the Rust engine the differential compares against
        run: cargo build --release --bin open-ontologies
      # shacl and align as well as dev. Those two extras are the whole reason
      # three more files skipped here, and they are small.
      # `hnswlib` is built from source rather than taken as a wheel.
      #
      # The published wheel is compiled for a newer CPU than some of GitHub's
      # runners provide, and it raises SIGILL on IMPORT. No `try`/`except`
      # reaches that: the interpreter dies during collection and takes the
      # whole suite with it, so the job fails with "Fatal Python error:
      # Illegal instruction" and a core dump, on branches that touched no
      # Python at all. Seen twice on 19 September 2026, on #211 (a docs-only
      # change) and #219. Building it here compiles for the CPU the job is
      # actually running on.
      #
      # Two more things, learned from the first attempt, which built from
      # source and STILL crashed on import. hnswlib's setup.py compiles with
      # `-march=native` unless HNSWLIB_NO_NATIVE is set, and setup-uv caches
      # BUILT WHEELS across runners, keyed by requirements files and never by
      # CPU, so a native build from one machine is handed to the next. The
      # env var drops the flag. `--no-cache` is what forces the compile:
      # measured locally, `--reinstall-package` and `--refresh-package` both
      # still "Prepared 1 package in 0.39ms" from the wheel cache, while
      # `--no-cache` logs "Building hnswlib" and the resulting compiler lines
      # contain -march=native 0 times with the env var and 4 without.
      - name: Install with the extras the tests need
        working-directory: python
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: uv pip install --system --no-cache --no-binary hnswlib ${{ matrix.constraints }} -e ".[dev,shacl,align]"
      - name: Test
        working-directory: python
        run: python -m pytest -q
      # The legs this job now provides the toolchain for. OO_REQUIRE_FIXTURES=1
      # turns any skip in them into a failure, so the job can no longer go green
      # by not running them. `fenic` is in no extra and no dependency list, so
      # test_dataframe.py is deliberately NOT here; it still skips loudly above.
      - name: The differential legs, where a skip is a failure
        working-directory: python
        run: |
          OO_REQUIRE_FIXTURES=1 python -m pytest -q \
            tests/test_horn_three_way_differential.py \
            tests/test_horn_differential.py \
            tests/test_horn_checked.py \
            tests/test_horn_rule_table.py \
            tests/test_shacl.py \
            tests/test_shacl_vacuous.py \
            tests/test_shacl_differential_harness.py \
            tests/test_align.py \
            tests/test_vocab_check.py

  # Nothing built, type-checked or linted `studio/` before this, so a green tick
  # on a PR that only touched Studio said nothing whatsoever about it (#64 is
  # exactly that PR).
  #
  # `tsc --noEmit` rather than `npm run build`: the build script chains
  # `vite build && npm run prepare-engine`, and prepare-engine stages the Rust
  # binary, which would make this job depend on a release build of the whole
  # crate. Type-checking is the part that catches the errors a reviewer cannot
  # see by reading a diff.
  studio:
    timeout-minutes: 15
    name: studio (typecheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24, the active LTS. Node 20 reached end of life on 30 Apr 2026 and
          # is no longer in the runner's toolcache, so every run downloaded it.
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install
        working-directory: studio
        run: npm ci
      - name: Type-check
        working-directory: studio
        run: npx tsc --noEmit

  # The Lean certificate layer. `lean/` holds a checker for the reasoner's
  # derivation certificates with a machine-checked soundness proof. Building
  # that directory IS the proof check: the `#guard_msgs` axiom tripwire in
  # OOCert/Soundness.lean fails the build on any `sorry`. The Rust test then
  # certifies every ontology this repository ships through the built checker
  # and proves the checker can also say no. OO_REQUIRE_FIXTURES=1 turns the
  # "no lake installed" skip into a failure, so this job cannot pass by not
  # running.
  #
  # The last three legs are the SAT/SMT family: a model finder proposes a
  # finite structure and `oo-folmodel` disposes. They need z3 and mace4 as well
  # as Lean, and the same environment variable turns a missing solver from a
  # loud skip into a failure here, for the same reason.
  # The last legs are the second kernel: Poly/ML, and the Isabelle/HOL
  # formalisation's exported checker run against the Lean one over the same
  # corpus. Raised from 45 minutes to 60 when that arrived, because it spawns two
  # processes per certificate over a corpus of a couple of thousand.
  lean:
    timeout-minutes: 60
    name: lean / certificate checker
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # elan pinned by digest, the toolchain download retried with backoff,
      # then `lake build`. .github/actions/lean-build/action.yml says why each.
      - name: Build lean/ (the proof check)
        timeout-minutes: 30
        uses: ./.github/actions/lean-build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Save the build cache even when the job fails. The default discards
          # it, and these jobs fail most often on a lint or a single test leg
          # that runs AFTER everything is compiled, so the default threw away
          # the expensive half of the work and made every fix-and-retry pay for
          # it again. Measured on 18 September 2026: two branches failed clippy
          # after a full build, and the lean job rebuilt a release binary from
          # cold for twelve minutes on a rerun that changed one line.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Certify every shipped ontology through the proved checker
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_certificate_test -- --nocapture
      - name: Check the verified SHACL Core evaluator against the W3C suite
        # This job used to run a bare `lake build` while `Shacl` was not a
        # default target, so the SHACL proofs did not compile at the commit
        # that carried them and this gate was green over them. The lakefile now
        # forces every target into the default set and this step measures the
        # verified evaluator, so both halves of that failure are closed.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test shacl_core_verified_test -- --nocapture
      - name: Check the description-logic model certificates
        run: OO_REQUIRE_FIXTURES=1 cargo test --test dl_model_certificate_test -- --nocapture
      - name: Reach the verified SHACL evaluator through the tool
        # The point of this leg is reachability. `Shacl/` has been mechanised
        # for a while and nothing in `src/` could call it, so the strongest
        # claim in the repository was a lab result with a binary beside it.
        # Strict, because a skip here would put it straight back.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test shacl_verified_tool_test -- --nocapture
      - name: The SHACL compiler names what it ignores
        # #206. Strict because four of the five tests need `oo-shacl`, and the
        # thing they protect is that a predicate the compiler waves through
        # still REACHES the report. A skip here restores the silence the issue
        # was about and nothing would go red.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test shacl_ignored_is_named_test -- --nocapture
      - name: Every checker names the binary that is running
        # #204. Strict: the point of the leg is that what a checker SAYS about
        # itself matches what sha2 computes over the same file, and a skip
        # would let an unverified SHA-256 in lean/SelfId/ go unmeasured on
        # three-megabyte inputs. The published vectors are checked at compile
        # time by #guard; this is the other half.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test checker_self_identification_test -- --nocapture
      - name: Reach the verified SHACL evaluator from the COMMAND LINE
        # The other half of #203. The tool could reach `oo-shacl` and the CLI
        # could not, so a user without an MCP client could not obtain the
        # repository's strongest SHACL answer at all. Strict for the reason the
        # leg above is strict, and for one more: two of these tests run the
        # batch executor and the single-command path, which are different code
        # that have already differed once.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test cli_verified_shacl_test -- --nocapture
      - name: A malformed count bound is refused on the verified path too
        # shacl_count_bound_test's verified half runs oo-shacl, which this job
        # builds. Without the binary it would skip and report ok (#321).
        run: OO_REQUIRE_FIXTURES=1 cargo test --test shacl_count_bound_test -- --nocapture
      - name: A numeric claim, checked in Lean
        # The integer path earns MatCert.mul_of_check, and the two cheaper
        # paths must NOT. Strict, because a skip here would let the three
        # verdict words drift together unnoticed, and the whole design is that
        # they stay apart.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test matcert_numeric_test -- --nocapture
      - name: The certified-claims figure says what a fresh run says
        # Strict for the reason the figure exists: it is generated, so it can
        # go stale while the generator stays right. A skip would let the
        # drawing and the code disagree in a release.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test certified_claims_asset_test -- --nocapture
      - name: Check the description-logic refutation certificates
        # The other half of the line above. That one certifies that an ontology
        # HAS a model by exhibiting one; this certifies that it has NONE by
        # exhibiting a closed tableau, and the verdicts are different sentences.
        # Strict, because the emitter and the checker are both in this
        # repository and a skip here would hide the whole loop.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test dl_refutation_certificate_test -- --nocapture
      - name: Pinpoint justifications, and check each one through the proved checker
        # Strict rather than excepted. The only thing this file skips on is
        # benchmark/reference/pizza-reference.owl, which ships with the
        # repository, so on a full checkout there is nothing for it to miss and
        # a skip here would mean the checkout is wrong.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test justify_test -- --nocapture
      - name: Annotate the closure with provenance semirings
        run: OO_REQUIRE_FIXTURES=1 cargo test --test provenance_test -- --nocapture
      - name: Check the refutation certificates
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_refutation_test -- --nocapture
      - name: Check the refutations THIS ENGINE writes, and that it cannot refute a consistent ontology
        # The line above checks hand-written fixtures, which settles whether the
        # checker works and says nothing about whether anything can feed it.
        # This one runs the engine, takes its `refutation.tsv`, and hands that
        # to the same binary. The two legs that matter most are the consistent
        # ontology, where no refutation may be produced and none may be
        # accepted, and the laundering guard, which fails if this engine ever
        # states the verdict only an accepted refutation earns.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_refutation_producer_test -- --nocapture
      - name: Check the mixed certificate layer
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_mixed_certificate_test -- --nocapture
      - name: Re-run the checker over a certificate carried inside a pack, and refuse a forged one
        # Two of this file's legs need a real oo-cert and the rest do not, so
        # without this step the forgery leg would skip for ever in the `build`
        # job and nothing would count the skip. The leg that matters is the one
        # that forges a conclusion INSIDE the packed certificate, repairs every
        # digest so only the proof can object, and requires the receiver to
        # refuse the load.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test pack_certificate_test -- --nocapture
      - name: Check the generic Horn-rule layer, and that a user rule cannot earn the absolute verdict
        # The five legs here are not interchangeable. Four of them prove the
        # checker rejects a specific forgery; the fifth proves that a
        # certificate over rules the user supplied reports a DIFFERENT verdict
        # from one over the built-ins. That last one is the difference between
        # a verification layer and a device for laundering an assumption into a
        # fact, and it is the reason this job exists rather than being folded
        # into the line above.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_horn_certificate_test -- --nocapture
      - name: Label a reasoning trace step by step, and check a user rule cannot earn the absolute word there either
        # The per-step form of the leg above. Every label a step can carry comes
        # out of an exit code this job's binaries produced, so without them the
        # file skips and reports `ok`, which is exactly what
        # OO_REQUIRE_FIXTURES=1 is here to stop. Two of its gates are the ones
        # this job exists for: a step licensed by a rule the user wrote reaches
        # `entailed_under_supplied_rules_checked` and nothing stronger, asserted
        # over the SERIALISED report; and a step whose own reasoning is sound
        # over premises the store does not hold is reported as exactly that
        # rather than as entailed.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test trace_label_test -- --nocapture
      - name: Run the README's own example and check it says what the README says
        # Issue #162. "Try the checker itself" prints three commands and the
        # JSON each returned, and until now nothing re-ran them, so the page
        # could drift from the checker silently. The commands and the expected
        # fields are read out of README.md rather than copied into the test, so
        # editing either side is what fails.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test readme_example_test -- --nocapture
      - name: Check the README animation against the checker it depicts
        # docs/assets/demo-certify.svg draws counts, a verdict word and a
        # theorem name in the first screen of the README, and nothing about an
        # SVG stops those drifting from the code. This re-runs oo-horn over the
        # fixtures the picture is of and compares. It needs lake for the same
        # reason every step above does.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test demo_asset_claims_test -- --nocapture
      - name: Install the model finders
        # Z3 reads SMT-LIB and can be asked the UNBOUNDED question, which is the
        # only route to `unsatisfiable_oracle`.
        # Mace4 ships in the LADR/Prover9 distribution: Prover9's refutations
        # are uncheckable and by decision 0005 an oracle opinion for ever, but
        # Mace4 is a FINITE MODEL FINDER and a finite model is exactly what
        # this layer certifies. The dead toolchain has a live half.
        # `prover9` has no installation candidate on Ubuntu noble, which is what
        # broke this job the first time it ran on main. LADR is built from the
        # maintained fork instead, pinned to a commit, with -std=gnu89 because
        # the source is K&R C and a current compiler otherwise rejects its
        # implicit-int parameters as errors. The recipe was run locally before
        # it was committed here. Only mace4 is installed: Prover9 itself is not
        # used anywhere, by decision 0005.
        #
        # Z3 is a release asset pinned by version and by digest, the way cvc5 is
        # in the next step, and no longer `apt-get install z3`. The apt package
        # is whatever the runner image carries (4.8.12 on 24.04, 4.13.3 on
        # 26.04), and the counts the SMT differential prints are a property of
        # the (z3, cvc5) version PAIR, so the image was choosing what the
        # measurement was about. It was also the one apt call in this job with
        # no timeout, the shape of call that hung CI for six hours on 18 Aug
        # 2026. The zip's bin/z3 needs only glibc 2.39 and libstdc++, both on
        # the image.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          z3dir="$RUNNER_TEMP/z3"
          mkdir -p "$z3dir"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 -o "$z3dir/z3.zip" \
            https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip
          echo "7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e  $z3dir/z3.zip" | sha256sum -c -
          unzip -q -o "$z3dir/z3.zip" 'z3-4.16.0-x64-glibc-2.39/bin/z3' -d "$z3dir"
          sudo install -m 755 "$z3dir/z3-4.16.0-x64-glibc-2.39/bin/z3" /usr/local/bin/z3
          z3 --version
          for attempt in 1 2 3; do
            git clone -q https://github.com/laitep/ladr.git /tmp/ladr && break
            rm -rf /tmp/ladr
            [ "$attempt" -lt 3 ] || { echo "::error::could not clone laitep/ladr"; exit 1; }
            sleep 30
          done
          git -C /tmp/ladr checkout -q 8317cb2dea069cd57723f76bdee7d6bd818103a7
          # Build ONLY the library and mace4. LADR's top-level `all` also builds
          # prover9, whose link rule puts -lm before the objects that need it;
          # GNU ld resolves libraries left to right, so that link fails on
          # Linux while macOS's linker, which ignores order, let it pass
          # locally. mace4.src is built before provers.src in that `all`, and
          # the first run on main showed mace4 had already linked when prover9
          # failed. Nothing here uses prover9, so nothing here builds it.
          make -C /tmp/ladr/ladr lib XFLAGS="-std=gnu89" > /tmp/ladr-build.log 2>&1 || { tail -30 /tmp/ladr-build.log; exit 1; }
          make -C /tmp/ladr/mace4.src all XFLAGS="-std=gnu89" >> /tmp/ladr-build.log 2>&1 || { tail -30 /tmp/ladr-build.log; exit 1; }
          sudo install -m 755 /tmp/ladr/bin/mace4 /usr/local/bin/mace4
          command -v z3 mace4
      - name: Install cvc5, the second SMT oracle
        # PINNED BY VERSION AND BY DIGEST, and the digest is the load-bearing
        # half. The release asset URL is stable and the zip is not signed, so
        # the hash is the only thing that says the bytes CI runs are the bytes
        # that were checked by hand. This is the same rule the Poly/ML step
        # below follows, and for the same reason.
        #
        # The version is pinned rather than tracked because the disagreement
        # counts this repository publishes are a property of a VERSION PAIR.
        # `latest` would silently change what the measurement is about, and the
        # next person to read the number would have no way to know.
        #
        # NOT `apt-get install cvc5`: Ubuntu noble carries no such package, and
        # `prover9` having no installation candidate on noble is exactly what
        # broke this job the first time it ran on main, so the check was done
        # rather than assumed.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 -o /tmp/cvc5.zip \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-static.zip
          echo "dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6  /tmp/cvc5.zip" | sha256sum -c -
          unzip -q -o /tmp/cvc5.zip -d /tmp/cvc5
          sudo install -m 755 /tmp/cvc5/cvc5-Linux-x86_64-static/bin/cvc5 /usr/local/bin/cvc5
          cvc5 --version | head -1
      - name: Check the first-order model certificates end to end
        # `lake build` already compiles these proofs, because `Fol` and
        # `oo-folmodel` are both in defaultTargets. What this leg adds is the
        # ENGINE's own export going through a real solver and back into the
        # verified checker, which is what decision 0006 recorded as missing.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_fol_model_test -- --nocapture
      - name: Check that an unchecked result never reports the certified word
        # The laundering guard, and the reason this is its own leg rather than
        # folded into the line above. A pipeline that fell back to
        # `model_checked` when the checker was unavailable would print the
        # certified word on every machine without Lean installed, and a run
        # whose bounded search was exhausted must say `no_model_up_to_size_k`
        # and never `unsatisfiable_oracle`. See docs/decisions/0006 item 4.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test fol_solver_verdict_test -- --nocapture
      - name: Check the tableaux verdict against a CHECKED model, not an oracle
        # The owl-dl path was the only layer with no live second opinion: its
        # conformance expectations are sourced from frozen `HermiT:` comments
        # and nothing re-runs HermiT, which is not installed here. This asks
        # for a MODEL instead and hands it to oo-folmodel, so a consistent
        # verdict is corroborated by a machine-checked theorem rather than by
        # another reasoner agreeing. Uses the z3 this job already installs.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test dl_consistency_differential_test -- --nocapture
      - name: Check the model ingestion, both front ends
        run: OO_REQUIRE_FIXTURES=1 cargo test --test fol_model_ingest_test -- --nocapture
      # Cached under the tarball's digest and the image it was compiled on, so
      # fmv.jku.at, a university server, is contacted only on a cold cache, and
      # then with retries and a bound. The self-test below runs every time.
      - name: Cache picosat
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/picosat-965
          key: picosat-965-15169b4f-ubuntu-24.04-${{ runner.arch }}
      - name: Build picosat with proof traces, the solver whose refutations oo-lrat checks
        # Ubuntu's picosat package cannot serve here: measured in ubuntu:24.04
        # (picosat 965-2), /usr/bin/picosat.trace is the build WITHOUT trace
        # support, the same size as /usr/bin/picosat, and `-T` aborts with
        # "compiled without trace support". `-T` is how src/sat.rs gets the
        # proof it converts to LRAT, so the solver is built from the upstream
        # 965 tarball with `--trace`, pinned by its SHA-256.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/picosat-965/picosat" ]; then
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 -o "$RUNNER_TEMP/picosat-965.tar.gz" https://fmv.jku.at/picosat/picosat-965.tar.gz
            echo "15169b4f28ba8f628f353f6f75a100845cdef4a2244f101a02b6e5a26e46a754  $RUNNER_TEMP/picosat-965.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/picosat-965.tar.gz" -C "$HOME"
            ( cd "$HOME/picosat-965" && ./configure.sh --trace && make picosat )
          fi
          cd "$RUNNER_TEMP"
          printf 'p cnf 1 2\n1 0\n-1 0\n' > unsat.cnf
          status=0; "$HOME/picosat-965/picosat" -T unsat.trace unsat.cnf || status=$?
          test "$status" -eq 20
          test -s unsat.trace
      - name: Refute a cheaper weighted repair through oo-lrat
        # #346. A weighted repair is called optimal when its branch and bound
        # closes; with a certificate the same claim is a CNF that picosat
        # refutes and oo-lrat checks under Lrat.unsat_of_check. Strict, because
        # the leg that matters needs both tools, and a skip here would leave
        # the word `refuted` printed by no run that CI ever sees.
        run: OO_SAT_SOLVER="$HOME/picosat-965/picosat" OO_REQUIRE_FIXTURES=1 cargo test --test repair_certificate_test -- --nocapture
      - name: Build the release binary the SMT differential drives
        # The differential compares the SMT-LIB THE PRODUCT EMITS, so it runs
        # the real binary rather than linking the library. `cargo test` does not
        # build it, and without this step the file would skip on a job that
        # provides everything else it needs, which is the shape of hole
        # `tests/ci_gate_coverage_test.rs` exists to close.
        run: cargo build --release --bin open-ontologies
      - name: Run Z3 and cvc5 over the same problems, and require them not to contradict
        # The SECOND SMT ORACLE, and the reason it is here at all.
        #
        # Decision 0006 upgrades a `sat` to a certificate when the verified
        # checker accepts the model, and leaves every `unsat` an oracle opinion,
        # because checking a CDCL(T) refutation needs a mechanised calculus this
        # repository does not have. So the `unsat` half of this layer has NO
        # defence that runs inside the architecture: nothing can check it, and a
        # wrong one would be published as `unsatisfiable_oracle` with a straight
        # face. A second solver is the only thing that can contradict it.
        #
        # --nocapture because the corpus size and the agreement counts are
        # PRINTED by the test and read out of this log. No document is allowed
        # to carry them by hand.
        #
        # The last leg of this file puts a LYING z3 on PATH and requires the run
        # to go red, so the gate is known to be able to fail rather than assumed
        # to be.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test smt_second_oracle_test -- --nocapture
      - name: Check that a projection preserves the claims an answer rests on
        # Coverage is a proxy, and the first two legs here are the argument for
        # that sentence: a slice of a SHIPPED ontology at coverage 1.0 with
        # ok:true that has dropped the one triple the answer depends on, and
        # its converse at coverage 0.001 preserving every claim with a
        # Lean-checked certificate. The rest are the verdict discipline and the
        # three conditions under which the monotonicity gate is disarmed.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_projection_entailment_test -- --nocapture
      - name: Check the goal-free closure diff
        run: OO_REQUIRE_FIXTURES=1 cargo test --test closure_diff_test -- --nocapture
      - name: Run the monotonicity differential over every shipped ontology
        # OWL RL is monotone and a projection is a subset, so anything the
        # projection entails and the source does not is a soundness bug in the
        # engine. This leg runs that check for real over the shipped corpus and
        # prints what it found, INCLUDING if it found nothing: a sweep whose
        # gate was disarmed everywhere establishes nothing, so the test fails
        # if the gate was armed on fewer than half the ontologies.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test projection_monotonicity_corpus_test -- --nocapture
      - name: Check the preserve and closure-diff command lines, including their exit codes
        # Wiring nothing exercises is how `push` came to be proxied to a batch
        # runner with no arm for it. These run the real binary, and they pin
        # that a lost claim fails the process rather than printing a finding
        # and exiting 0.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test preserve_cli_test -- --nocapture
      - name: Show every gate firing on its own broken input
        # A gate that cannot fail is decoration, and a gate whose failure
        # nobody has read is close to it. This leg feeds each gate the input
        # built to trip it and PRINTS what the tool said, so the evidence is in
        # the job log rather than in a doc.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test gate_demonstration_test -- --nocapture
      # Four files that need nothing this job does not already have.
      #
      # Each of them calls `common::skip_unless` on lake, lake is installed
      # above, and no leg invoked any of them — so in the only job that could
      # have run them they were not run, and in every job that ran them
      # (`build`, with no lake) they skipped. A file that skips wherever it runs
      # and is not run where it would not skip is a gate in name only.
      # docs/ci-gates.md is the table this came out of.
      - name: The certificate boundary, against the real Lean parser
        run: OO_REQUIRE_FIXTURES=1 cargo test --test certificate_boundary_proptest -- --nocapture
      - name: OWL RL rule coverage against the checker's own table
        run: OO_REQUIRE_FIXTURES=1 cargo test --test reason_rl_coverage_test -- --nocapture
      - name: The SWRL and RIF front ends, through the checker
        run: OO_REQUIRE_FIXTURES=1 cargo test --test rule_syntax_frontend_test -- --nocapture
      - name: The emitted Horn rule table, round-tripped through oo-horn
        run: OO_REQUIRE_FIXTURES=1 cargo test --test reason_horn_emit_test -- --nocapture
      # THE SECOND KERNEL.
      #
      # `isabelle/` is an independent formalisation of the same Horn certificate
      # checker, written from the W3C sources with the Lean unread, and
      # `tests/cross_kernel_differential_test.rs` runs both over one corpus and
      # requires them to agree on every row. The README states the result of that
      # comparison in its opening pages. Until 15 September 2026 NO JOB PROVIDED
      # BOTH HALVES: the file ran only in `build`, which has neither lake nor
      # Poly/ML, so it skipped there, and this job, which has lake, invoked it
      # from no leg at all. A skip reports `ok`, so a front-page claim was gated
      # by whether a developer happened to have Poly/ML installed.
      #
      # THE FULL ISABELLE DISTRIBUTION IS NOT NEEDED AND IS NOT INSTALLED. The
      # verified checker is exported to Standard ML by `isabelle/export.sh` and
      # `isabelle/driver/oo_horn_generated.ML` is COMMITTED, so the only thing
      # missing here is a Poly/ML to compile and link it against. Isabelle
      # publishes Poly/ML as a component of its own: 39 MB, against several
      # gigabytes for the distribution, and it is the SAME build that produced
      # that file: 5.9.2-2, what Isabelle2025-2 bundles, so CI and the
      # developer machine run one compiler and not two.
      #
      # NOT `apt-get install polyml`, and this was checked rather than assumed,
      # because `prover9` having no installation candidate on noble is what broke
      # this job the first time it ran on main. The package exists, and it is
      # wrong twice over: Ubuntu noble carries Poly/ML 5.7.1, seven years older
      # than the compiler this ML was generated by, and the package ships
      # /usr/bin/poly and libpolymain.a with NO libpolyml.a, so there is nothing
      # to link the exported checker against.
      #
      # What this leg proves that the Lean legs above cannot: that the two
      # formalisations still read the same bytes the same way. A row where they
      # part company is the most valuable output this repository has, and the
      # test fails on any row at all.
      - name: Cache Poly/ML
        id: polyml
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/polyml
          key: polyml-5.9.2-2-${{ runner.arch }}
      - name: Install Poly/ML, the second kernel's runtime
        if: steps.polyml.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Pinned by digest, not by name. The component URL is stable and the
          # tarball is not signed, so the hash is the only thing that says the
          # bytes CI links against are the bytes that were checked by hand.
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 -o /tmp/polyml.tar.gz https://isabelle.in.tum.de/components/polyml-5.9.2-2.tar.gz
          echo "67351868c05440d72a514ca60e8ee1d3252b288d746eb7ad236bda5fcaf12272  /tmp/polyml.tar.gz" | sha256sum -c -
          mkdir -p ~/polyml
          # One platform directory out of the eight in the tarball, unwrapped so
          # POLYDIR is the same path whatever the runner's architecture is: 20 MB
          # on disk rather than 200, and no second place to edit if this job
          # moves to an arm64 runner.
          arch=$(uname -m); [ "$arch" = "aarch64" ] && arch=arm64
          tar xzf /tmp/polyml.tar.gz -C ~/polyml --strip-components=2 "polyml-5.9.2-2/${arch}-linux"
          ls -l ~/polyml/poly ~/polyml/libpolyml.a ~/polyml/libpolymain.a
      - name: Run the two verified kernels over one corpus, and require them to agree
        # `isabelle/build_native.sh` links the committed export into a native
        # binary, the test builds the Lean one with lake, and every certificate
        # goes through both. --nocapture because the corpus size, the depth
        # distribution and the divergence count are PRINTED by the test and read
        # out of this log: no document is allowed to carry them by hand.
        run: POLYDIR=$HOME/polyml OO_REQUIRE_FIXTURES=1 cargo test --test cross_kernel_differential_test -- --nocapture
      # THE THIRD KERNEL.
      #
      # `rocq/` is a third independent formalisation of the same Horn certificate
      # checker, in Rocq 9.2, written from the specifications and the fixture data
      # with nothing under `lean/OOCert/` or `isabelle/` opened.
      # `tests/rocq_kernel_differential_test.rs` runs it beside the Lean one over a
      # corpus of its own and requires them to agree except on one named cause,
      # which is recorded in docs/decisions/0012.
      #
      # ROCQ 9.2 IS IN NO UBUNTU APT REPOSITORY, and this was checked rather than
      # assumed, because `prover9` having no installation candidate on noble is what
      # broke this job the first time it ran on main. There is no `rocq` package at
      # all; noble ships `coq` 8.18, which cannot read `From Stdlib Require`, the
      # form every theory here uses. Building from source with opam takes half an
      # hour. The official container image is the route, and the version is asserted
      # INSIDE the container so that a moved tag fails loudly rather than silently
      # checking the proofs with a different prover.
      #
      # The image is pinned by digest as well as by tag, so a re-pushed 9.2.0 tag
      # cannot change the prover under the proofs; the in-container version
      # assertion stays as the readable half of the same check.
      #
      # The workspace is made group and world writable first because the image runs
      # as its own uid and the runner's checkout is owned by the runner's. The
      # ownership is handed back afterwards so the Rust legs can read the binary.
      - name: Build the third formalisation, and check its axiom footprint
        # Bounded, because the image pull from Docker Hub had no bound at all.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          chmod -R a+rwX .
          # BASH, not sh. build.sh uses arrays, and /bin/sh on the image is dash,
          # which does not have them. The image's ENTRYPOINT is `opam exec --`, so
          # rocq, ocamlopt and ocamlfind are already on PATH and no `opam env` dance
          # is needed; the tool check below fails loudly if that ever stops being
          # true, rather than leaving `make` to fail three screens later.
          docker run --rm -v "$PWD:/work" -w /work rocq/rocq-prover:9.2.0@sha256:33926fb3757b2b560c3844157bd64173a26b6d338a256be1ae5eec8df2019025 \
            bash -c 'set -eu
                     command -v rocq make ocamlopt
                     rocq --version
                     rocq --version | grep -q "version 9\.2" \
                       || { echo "the image is not Rocq 9.2"; exit 1; }
                     bash rocq/build.sh'
          sudo chown -R "$(id -u):$(id -g)" rocq
          ls -l rocq/build/oo-horn-rocq
      # A gate nobody has watched fail is decoration. This breaks one Qed in a
      # scratch copy and requires the audit to reject it, so the line above is
      # known to be measuring something.
      - name: Show the axiom gate failing on an admitted proof
        timeout-minutes: 15
        run: |
          set -euo pipefail
          chmod -R a+rwX .
          docker run --rm -v "$PWD:/work" -w /work rocq/rocq-prover:9.2.0@sha256:33926fb3757b2b560c3844157bd64173a26b6d338a256be1ae5eec8df2019025 \
            bash -c 'bash rocq/build.sh --prove-the-gate-can-fail'
          sudo chown -R "$(id -u):$(id -g)" rocq
      - name: Run the Lean and Rocq kernels over one corpus, and require them to agree
        # --nocapture because the corpus size and every per-bucket count are PRINTED
        # by the test and read out of this log. No document is allowed to carry them
        # by hand; docs/decisions/0012 says so in the paragraph that carries a
        # snapshot of them.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test rocq_kernel_differential_test -- --nocapture
      # And the gate on the gates. This one needs no toolchain; it fails when a
      # test file that can skip is run by no job under OO_REQUIRE_FIXTURES=1 and
      # is not on the written exception list. It is the mechanism the leg above
      # was missing for as long as it existed.
      - name: Every skippable test file is strict somewhere, or excepted in writing
        run: OO_REQUIRE_FIXTURES=1 cargo test --test ci_gate_coverage_test -- --nocapture

  # The official W3C SHACL test suite, as a ratchet.
  #
  # `shacl-differential` above compares this engine against pyshacl on OUR
  # corpus, which measures agreement with one other implementation on data we
  # chose. This measures conformance against the Working Group's own suite on
  # data they chose, which is the only number that can be quoted outside this
  # repository. The two are complementary and neither replaces the other.
  #
  # The gate is monotone, not pass-all: PASS may not drop, FAIL may not rise,
  # and no named PASS may regress against tests/w3c_shacl_baseline.json, in each
  # of two columns: the (focus, source shape, component) set, 61 of 120 PASS on
  # 24 Oct 2026, and the full tuple with path, value and severity as a multiset,
  # 53 of 120 on 28 Oct 2026 (#319; 12 before #318 put sh:value on default-path
  # results, 51 before #333 fixed the sh:or datatype false negative, 52 before
  # #334 kept a custom severity's namespace).
  # Pretending otherwise would be exactly the silent success
  # this repository keeps finding elsewhere. See the module docs in
  # tests/w3c_shacl_conformance_test.rs.
  #
  # Cheap by construction: no Python, no network, no release build. The suite is
  # vendored under tests/w3c-shacl/ (632 KB, W3C Software and Document License)
  # so the job is offline and deterministic. OO_REQUIRE_FIXTURES=1 turns the
  # "suite missing" skip into a failure, so it cannot pass by not running.
  w3c-shacl:
    # 25, not 15. A cold build of this job ran at 60 to 72 percent of 15 minutes
    # in October, whenever the Actions cache had evicted main's entry, which
    # leaves a required check one slow runner away from a timeout.
    timeout-minutes: 25
    name: SHACL conformance vs the W3C suite
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Save the build cache even when the job fails. The default discards
          # it, and these jobs fail most often on a lint or a single test leg
          # that runs AFTER everything is compiled, so the default threw away
          # the expensive half of the work and made every fix-and-retry pay for
          # it again. Measured on 18 September 2026: two branches failed clippy
          # after a full build, and the lean job rebuilt a release binary from
          # cold for twelve minutes on a rerun that changed one line.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the suite and hold the ratchet
        run: |
          set -o pipefail
          OO_REQUIRE_FIXTURES=1 cargo test --test w3c_shacl_conformance_test -- --nocapture \
            2>&1 | tee w3c-shacl-conformance.log
      - name: The W3C report graph matches the suite's expected reports
        # shacl_validation_report_w3c_test reads the same vendored suite and
        # skips without it; this job is where the suite is guaranteed (#318).
        run: OO_REQUIRE_FIXTURES=1 cargo test --test shacl_validation_report_w3c_test -- --nocapture
      - name: Upload the per-test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w3c-shacl-conformance
          path: w3c-shacl-conformance.log
