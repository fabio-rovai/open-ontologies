name: Benchmark
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    # A ceiling rather than a measurement: this has not been run since it was
    # written, so 180 leaves the first run room and still stops a hang well
    # before GitHub's six hours.
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Rust CI tests with, so a timing measures the engine as CI builds it
      # and not as a newer compiler would. ci.yml's build job says why it is
      # pinned this way.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install matplotlib
      - name: Build Open Ontologies
        run: cargo build --release --locked --features embeddings
      - name: Download reasoner JARs
        run: bash benchmark/reasoner/setup_jars.sh
      # OO_BIN is absolute: both scripts run after `cd benchmark/reasoner`, where
      # ./target/release/open-ontologies does not exist, so the first run of
      # this workflow would have failed to find the engine it benchmarks.
      - name: Run Pizza correctness
        run: |
          export OO_BIN="$GITHUB_WORKSPACE/target/release/open-ontologies"
          cd benchmark/reasoner && bash run_pizza_correctness.sh
      - name: Run LUBM performance
        run: |
          export OO_BIN="$GITHUB_WORKSPACE/target/release/open-ontologies"
          cd benchmark/reasoner && bash run_lubm_performance.sh
      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark/reasoner/results/
