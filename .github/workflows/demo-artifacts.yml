name: demo artifacts
# main, and pull requests. `on: [push, pull_request]` also ran it on every push
# to every branch, so a same-repository pull request ran it twice per commit.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  manifest:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify committed artifacts match their manifest
        run: cd demo/precomputed && shasum -a 256 -c MANIFEST.sha256
      # MANIFEST.sha256 only proves each committed file matches its OWN
      # recorded checksum; it says nothing about whether bundle.json still
      # reflects a real merge of the other five parts. A part and the bundle
      # could drift apart together (edit findings.json, forget to
      # regenerate bundle.json, re-run shasum so both individually still
      # check out) and this job would still pass. Regenerating bundle.json
      # from the committed parts and diffing it catches exactly that: it
      # needs no model and no engine, since bundle_fixtures.py only reads
      # and merges JSON already on disk.
      - name: Regenerate bundle.json from its parts and diff against the committed copy
        run: |
          python3 demo/bundle_fixtures.py --in demo/precomputed --out /tmp/bundle.regenerated.json
          diff demo/precomputed/bundle.json /tmp/bundle.regenerated.json
      # The replay's 3D legend says every edge is asserted, certified by
      # OOCert.certificate_sound, or forged and refused (#425). graph.json is
      # written by demo/build_certified_graph.py only after oo-cert, oo-horn and
      # the Isabelle checker judge the run, and those take the lean job's
      # toolchain to rebuild. What runs here, with nothing built, is that the
      # committed graph is the one that script writes: its warrants are backed
      # by its evidence block, its source is this repository's ies-core.ttl,
      # and `make demo` cannot overwrite it with the unwarranted DCAT-US graph.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: The replay graph carries the warrants its legend names
        run: |
          pip install "pytest==8.4.2"
          python3 -m pytest -q demo/tests/test_build_certified_graph.py demo/tests/test_build_precomputed.py
