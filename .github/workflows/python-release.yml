name: Python Release

# Publishes the python/ bridge (open-ontologies-lite) to PyPI on a py-v* tag,
# e.g. `git tag py-v0.1.1 && git push origin py-v0.1.1`.
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored. Configure once at
# https://pypi.org/manage/project/open-ontologies-lite/settings/publishing/
#   Owner: fabio-rovai | Repo: open-ontologies
#   Workflow: python-release.yml | Environment: pypi
on:
  push:
    tags: ['py-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Build wheel + sdist
        working-directory: python
        run: uv build
      - name: Check metadata
        working-directory: python
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # OIDC token for Trusted Publishing; no secret needed
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
