name: Python Release

# Publishes the python/ bridge (open-ontologies-lite) to PyPI on a py-v* tag,
# e.g. `git tag py-v0.1.1 && git push origin py-v0.1.1`. The tag uses the
# version exactly as PEP 440 normalises it (py-v0.6.0rc1, not py-v0.6.0-rc.1),
# because that is the version the wheel's file name carries.
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored. Configure once at
# https://pypi.org/manage/project/open-ontologies-lite/settings/publishing/
#   Owner: fabio-rovai | Repo: open-ontologies
#   Workflow: python-release.yml | Environment: pypi
on:
  push:
    tags: ['py-v*']
  # A dry run of `build` on any pull request that changes the package's version
  # or this file. `publish`, and `ci-green`, which guards it, run only for a
  # tag.
  pull_request:
    paths:
      - '.github/workflows/python-release.yml'
      - 'python/pyproject.toml'
      - 'python/src/open_ontologies_lite/__init__.py'

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache on the publish path, so the wheel is built from this tree and
      # nothing another run left behind.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Build wheel + sdist
        working-directory: python
        run: uv build
      - name: Check metadata
        working-directory: python
        run: uvx twine check dist/*
      # The version is written in two places, pyproject.toml and __version__,
      # and a tag can land on a commit where either is stale. Nothing compared
      # them, so PyPI could receive a wheel whose metadata and whose
      # `__version__` disagree, under a tag that names neither.
      - name: The tag, pyproject.toml, __version__ and the wheel agree
        working-directory: python
        run: |
          set -euo pipefail
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          code=$(python3 -c 'import ast; t = ast.parse(open("src/open_ontologies_lite/__init__.py").read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and any(getattr(x, "id", None) == "__version__" for x in n.targets)))')
          wheel=$(ls dist/*.whl)
          built=$(basename "$wheel" | cut -d- -f2)
          echo "pyproject.toml $declared; __version__ $code; wheel $built"
          [ "$declared" = "$code" ] || { echo "::error::pyproject.toml says $declared and __version__ says $code"; exit 1; }
          [ "$declared" = "$built" ] || { echo "::error::the wheel is $built and pyproject.toml says $declared"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            want="${GITHUB_REF_NAME#py-v}"
            [ "$want" = "$declared" ] || { echo "::error::tag $GITHUB_REF_NAME and the package version $declared disagree"; exit 1; }
          fi
      # CI tests the source tree; this is the file PyPI will receive. Installed
      # into a clean environment of its own and imported, so a packaging fault
      # such as a module left out of the wheel fails here and not for the first
      # user who installs it.
      - name: The wheel that will be published installs and imports
        working-directory: python
        run: |
          set -euo pipefail
          uv venv --python python3 "$RUNNER_TEMP/wheel-check"
          uv pip install --python "$RUNNER_TEMP/wheel-check/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -c 'import open_ontologies_lite as m; print(m.__name__, m.__version__, m.__file__)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error

  # Nothing reaches PyPI from a commit CI has not passed. release.yml's
  # ci-green job puts the same gate on the engine, whose v2.0.1 shipped with no
  # CI run at all; here it waits for the one required check that tests this
  # package. py-v0.4.0 was on PyPI at 11:17 UTC on 19 Aug 2026, a minute before
  # CI first started on its commit. The newest GitHub Actions run of that check
  # on the tagged commit must have concluded success: a run still going is
  # polled once a minute for up to 90 minutes, and one that failed stops the
  # release at once.
  ci-green:
    if: github.ref_type == 'tag'
    timeout-minutes: 100
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The tagged commit passed the required CI check
        shell: bash
        run: |
          set -euo pipefail
          # Exactly as GitHub names it. A job renamed in ci.yml has to be
          # renamed here too, or every release waits out the deadline.
          required=(
            "python (open-ontologies-lite)"
          )
          minutes=90
          # "<passed|failed|running|missing> <conclusion or status> <url>" for
          # the newest run GitHub Actions made under this exact name. The
          # newest decides, so a re-run still going is waited for, and a re-run
          # that failed counts even where an older run passed.
          newest() {
            local enc
            enc=$(jq -rn --arg n "$1" '$n | @uri')
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$enc&filter=all&per_page=100" \
              | jq -rs --arg n "$1" '
                  [.[].check_runs[] | select(.name == $n and .app.slug == "github-actions")]
                  | max_by(.id)
                  | if . == null then "missing - -"
                    elif .status != "completed" then "running \(.status) \(.html_url)"
                    elif .conclusion == "success" then "passed success \(.html_url)"
                    else "failed \(.conclusion) \(.html_url)" end'
          }
          deadline=$(( $(date +%s) + minutes * 60 ))
          unanswered=0
          while :; do
            passed=() waiting=() failed=() api_failed=false
            for name in "${required[@]}"; do
              if ! state=$(newest "$name" 2>"$RUNNER_TEMP/check-runs.err"); then
                api_failed=true
                echo "::warning::could not read the check runs named '$name': $(tr '\n' ' ' <"$RUNNER_TEMP/check-runs.err")"
                waiting+=("'$name' could not be read from the API")
                continue
              fi
              read -r kind detail url <<<"$state"
              case "$kind" in
                passed) passed+=("'$name' passed: $url") ;;
                failed) failed+=("'$name' concluded $detail: $url") ;;
                running) waiting+=("'$name' is $detail: $url") ;;
                *) waiting+=("'$name' has no run from GitHub Actions on this commit") ;;
              esac
            done
            if [ "${#failed[@]}" -gt 0 ]; then
              printf '::error::%s\n' "${failed[@]}"
              echo "::error::Refusing to publish $GITHUB_REF_NAME from $GITHUB_SHA. Re-run what failed in CI, and re-run this job once it passes."
              exit 1
            fi
            if [ "${#waiting[@]}" -eq 0 ]; then
              printf '%s\n' "${passed[@]}"
              exit 0
            fi
            if $api_failed; then unanswered=$((unanswered + 1)); else unanswered=0; fi
            if [ "$unanswered" -ge 5 ]; then
              echo "::error::Refusing to publish $GITHUB_REF_NAME: the check runs could not be read in five rounds running."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              for w in "${waiting[@]}"; do echo "::error::after $minutes minutes, $w"; done
              echo "::error::Refusing to publish $GITHUB_REF_NAME from $GITHUB_SHA. Re-run this job once CI has passed on that commit; CI runs on pushes to main and on pull requests into main, and nowhere else."
              exit 1
            fi
            printf -v line '%s; ' "${waiting[@]}"
            echo "$(date -u +%H:%M:%S) waiting: ${line%; }"
            sleep 60
          done

  publish:
    if: github.ref_type == 'tag'
    needs: [build, ci-green]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write          # OIDC token for Trusted Publishing; no secret needed
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
