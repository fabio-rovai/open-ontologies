name: Release
on:
  push:
    tags: ['v*']
  # A DRY RUN of the release, on any pull request that changes what the release
  # is built from or how, and on demand. Every build, checker and assembly step
  # runs exactly as it does for a tag; `publish` and `image`, the only jobs that
  # write anywhere, run only for a tag. Until this existed the one way to run
  # this file was to push a v* tag, which publishes. That is how the macos-14
  # retirement on 2 Nov 2026 would have been found: the x86_64-apple-darwin leg
  # failing on a real tag, no GitHub release, and the Docker workflow pushing
  # :latest regardless. `ci-green` runs only for a tag as well, because all it
  # does is hold `publish` back.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/lean-build/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check-release-version.sh'
      - 'scripts/extract-changelog.sh'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tag and the Cargo.toml version are set by separate commits, so a tag can
  # land before the bump. When it does the release builds and publishes cleanly
  # while the binary reports the previous version, which is a silent failure that
  # flatters the release. Checked before anything is built, so no artifact
  # carrying the wrong number is ever produced.
  #
  # The CHANGELOG section is checked here too. A tag with no section under its
  # version used to publish a release with an empty body after one warning.
  #
  # `latest` is true only for the highest stable v* tag on the remote, so a
  # backport such as v2.1.1 after v2.2.0 does not become the GitHub "Latest"
  # release or move ghcr :latest backwards. A version with a hyphen is a
  # SemVer pre-release and is published as one.
  verify-version:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Decide what this run releases
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/check-release-version.sh "$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
            publish=false
            echo "Dry run on $GITHUB_REF: everything for $version is built and checked, and nothing is published."
          fi
          if ! bash scripts/extract-changelog.sh "$version" > /dev/null; then
            echo "::error::CHANGELOG.md has no section for $version. Rename [Unreleased] to it before tagging."
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          latest=false
          if [ "$publish" = true ] && [ "$prerelease" = false ]; then
            highest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' \
              | { grep -v -- - || true; } | sort -V | tail -n 1)
            echo "highest stable v* tag on origin: ${highest:-<none>}"
            if [ "$GITHUB_REF_NAME" = "$highest" ]; then latest=true; fi
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version publish=$publish prerelease=$prerelease latest=$latest"

  build:
    needs: verify-version
    # By target alone. GitHub otherwise names a matrix job after every value in
    # its row, and the Linux row holds an image digest.
    name: build (${{ matrix.target }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # A Linux binary needs no newer glibc than the one it was linked
          # against. v2.1.0 was linked on GitHub's ubuntu-22.04 image, glibc
          # 2.35, and needs GLIBC_2.34 at most (read from its ELF version needs
          # on 2 Nov 2026). That image is browned out from 23 Mar 2027 and
          # retired on 17 Apr 2027 (actions/runner-images#14254), so the leg
          # runs on ubuntu-24.04 inside Ubuntu 22.04's own image, which keeps
          # the 2.35 floor without the retiring VM. Pinned by digest to the
          # ubuntu:22.04 index as of 2 Nov 2026, built 25 Oct with libc6
          # 2.35-0ubuntu3.15; its linux/amd64 manifest is
          # sha256:8a2321a92b438238f93b4346fff61bc4259c99fdd4d9b52ee86f153fee0c344f.
          - os: ubuntu-24.04
            container: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
            target: x86_64-unknown-linux-gnu
            artifact_name: open-ontologies
            glibc: '2.35'
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: open-ontologies
            minos: '11.0'
          # macos-15, not macos-14, which GitHub retired on 2 Nov 2026. Both are
          # Apple silicon images, so this leg was already a cross-compile with
          # `--target` and stays exactly that.
          - os: macos-15
            target: x86_64-apple-darwin
            artifact_name: open-ontologies
            minos: '10.12'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: open-ontologies.exe
    runs-on: ${{ matrix.os }}
    # Only the Linux row names an image. An empty string means no container:
    # actions/runner#266 (13 Jan 2020) made it so for exactly this matrix, a
    # Linux container beside macOS and Windows, and runner v2.338.2 still
    # returns no container for it. `|| ''` turns the key the other rows leave
    # out into that empty string.
    container: ${{ matrix.container || '' }}
    steps:
      # The image is bare Ubuntu 22.04: no sudo, which root does not need, and
      # none of what the build needs. This runs before checkout so that
      # actions/checkout finds git and clones rather than downloading a
      # tarball. clang is for bindgen, which oxrocksdb-sys runs and which
      # loads libclang (the Dockerfile installs it for the same reason), and
      # binutils is for the glibc check. The packages come from the 22.04
      # archive as it is on the day, and the glibc they link against stays
      # 2.35. apt is bounded as in ci.yml: an unbounded `apt-get update` hung
      # CI for the full six hour ceiling when a mirror went dark.
      - name: Install the build tools in the container
        if: matrix.container
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          apt=(apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          "${apt[@]}" update
          DEBIAN_FRONTEND=noninteractive "${apt[@]}" install -y --no-install-recommends \
            curl ca-certificates build-essential binutils clang pkg-config libssl-dev libpq-dev git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Rust CI tests with, so a release is built by the compiler its commit
      # was tested with and not by whatever was newest on the day of the tag.
      # ci.yml's build job says why it is pinned this way.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Build
        # --locked, so a tag whose Cargo.lock lags Cargo.toml fails instead of
        # publishing dependencies resolved at release time.
        run: cargo build --release --locked --features embeddings,plugins --target ${{ matrix.target }}
      # .cargo/config.toml links the MSVC runtime statically. This is the check
      # that it worked: GitHub's Windows images carry the Visual C++
      # Redistributable, so a binary that still imports it runs fine here and
      # fails on a clean Windows machine, which is what v2.1.0 did.
      - name: The Windows binary imports no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          dumpbin=$("$vswhere" -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | tr -d '\r' | head -n 1)
          [ -n "$dumpbin" ] || { echo "::error::dumpbin.exe not found"; exit 1; }
          dumpbin=$(cygpath -u "$dumpbin")
          deps=$("$dumpbin" -nologo -dependents "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}")
          echo "$deps"
          if grep -iE 'vcruntime[0-9]*\.dll|msvcp[0-9]*\.dll' <<<"$deps"; then
            echo "::error::the binary still needs the Visual C++ Redistributable"
            exit 1
          fi
      # The oldest macOS each binary runs on, as Rust's defaults set it and as
      # v2.1.0 shipped. A runner image or toolchain that raised it would drop
      # users silently, so a change has to be made here, on purpose.
      - name: The macOS binary keeps its minimum macOS version
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          got=$(otool -l "$bin" | awk '
            /LC_VERSION_MIN_MACOSX/ { m = 1 } /LC_BUILD_VERSION/ { b = 1 }
            m && $1 == "version" { print $2; exit }
            b && $1 == "minos" { print $2; exit }')
          echo "${{ matrix.target }}: minimum macOS $got, expected ${{ matrix.minos }}"
          [ "$got" = "${{ matrix.minos }}" ] || { echo "::error::minimum macOS moved from ${{ matrix.minos }} to $got"; exit 1; }
      # The newest glibc the Linux binary needs, the highest GLIBC_ version
      # among the symbols it imports, for the same reason as the macOS check:
      # an image or toolchain that raised it would drop users silently.
      - name: The Linux binary keeps its glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          floor="${{ matrix.glibc }}"
          [ -n "$floor" ] || { echo "::error::this Linux leg declares no glibc floor in the matrix"; exit 1; }
          bin="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          versions=$(objdump -T "$bin" | { grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' || true; } | sed 's/^GLIBC_//' | sort -uV)
          [ -n "$versions" ] || { echo "::error::objdump -T found no GLIBC_ version in $bin"; exit 1; }
          got=$(tail -n 1 <<<"$versions")
          echo "${{ matrix.target }}: needs glibc $got at most, floor $floor; references ${versions//$'\n'/ }"
          [ "$(printf '%s\n' "$got" "$floor" | sort -V | tail -n 1)" = "$floor" ] \
            || { echo "::error::the binary needs glibc $got, above the $floor floor"; exit 1; }
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-ontologies-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error

  # The checkers, for the one platform that has to run them without a Lean
  # toolchain: the hosted demo.
  #
  # Until this job existed the release shipped the engine and not the thing that
  # checks the engine. "Hand the reviewer a proof they can check" required that
  # reviewer to install elan and build Lean first, and the demo could not show a
  # certificate at all, so a visitor met a front page whose central claim the
  # page itself could not demonstrate. These binaries are a few MB each.
  #
  # EVERY [[lean_exe]] in lean/lakefile.toml is published, read from the lakefile
  # rather than from a list here. The list here had drifted to five of the ten:
  # oo-matcert and oo-folmodel, which the engine itself runs, and oo-dlmodel,
  # oo-refute and oo-dlrefute, which check what the engine writes, were never
  # published, so a user of a release binary could not get those verdicts.
  #
  # Built from the tagged tree with no cache. The job used to restore lean/.lake
  # from ci.yml's cache, so v2.1.0's checkers were binaries another workflow had
  # built, attested here as if this one had.
  checkers:
    # The same gate `build` has, so nothing is built for a tag already known
    # to be wrong.
    needs: verify-version
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build lean/ from the tagged tree, with no cache
        timeout-minutes: 25
        uses: ./.github/actions/lean-build
        with:
          use-cache: 'false'
      - name: Name every checker for the platform it was built on
        run: |
          set -euo pipefail
          mkdir -p out
          names=$(python3 -c 'import tomllib; print("\n".join(e["name"] for e in tomllib.load(open("lean/lakefile.toml", "rb"))["lean_exe"]))')
          # oo-cert and oo-horn are required: the demo runs the first and the
          # repository's own front page quotes the second. The first-order
          # checker is accepted under either of its names.
          for b in oo-cert oo-horn; do
            grep -qx "$b" <<<"$names" || { echo "::error::lean/lakefile.toml no longer declares $b"; exit 1; }
          done
          grep -qxE 'oo-resolution|oo-fores' <<<"$names" \
            || { echo "::error::no first-order resolution checker under either name"; exit 1; }
          for b in $names; do
            src="lean/.lake/build/bin/$b"
            [ -x "$src" ] || { echo "::error::$b is declared in lean/lakefile.toml and was not built"; exit 1; }
            cp "$src" "out/${b}-x86_64-unknown-linux-gnu"
          done
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkers-x86_64-unknown-linux-gnu
          path: out/*
          if-no-files-found: error

  # Everything a release publishes, laid out under its asset names, checked, and
  # handed to `publish` as one artifact. It runs on dry runs too, so the checks
  # below are exercised on every pull request that touches this file and not
  # first on a tag.
  assemble:
    needs: [verify-version, build, checkers]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
      # A missing platform fails here. Before, a build leg that uploaded nothing
      # still passed, and the release published without that platform.
      - name: Lay out every asset under its published name
        run: |
          set -euo pipefail
          mkdir -p release/assets
          for t in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            ext=""
            [ "$t" = x86_64-pc-windows-msvc ] && ext=".exe"
            src="dl/open-ontologies-$t/open-ontologies$ext"
            [ -f "$src" ] || { echo "::error::no engine binary was built for $t"; exit 1; }
            cp "$src" "release/assets/open-ontologies-$t$ext"
          done
          names=$(python3 -c 'import tomllib; print("\n".join(e["name"] for e in tomllib.load(open("lean/lakefile.toml", "rb"))["lean_exe"]))')
          for b in $names; do
            src="dl/checkers-x86_64-unknown-linux-gnu/$b-x86_64-unknown-linux-gnu"
            [ -f "$src" ] || { echo "::error::checker $b is missing from the checkers artifact"; exit 1; }
            cp "$src" release/assets/
          done
          chmod +x release/assets/*
          ls -la release/assets
      # THE BINARY ITSELF, ASKED WHAT IT IS.
      #
      # `verify-version` compares the tag to Cargo.toml before anything builds,
      # which catches the cause. This catches the HARM, and they are not the
      # same check: a correct tag can still ship a stale binary if a cache
      # returns an object built from another tree, and nothing upstream of here
      # would notice. `status` is the only version the engine reports about
      # itself, so running it is the one question that cannot be answered
      # wrongly by accident.
      #
      # The Linux build runs on this runner, so this is a real execution and
      # not a second reading of the same file.
      - name: The published binary reports the version of its release
        run: |
          set -euo pipefail
          bin="release/assets/open-ontologies-x86_64-unknown-linux-gnu"
          got=$("./$bin" status | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "release $VERSION; the binary reports $got"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::the binary about to be published reports $got and the release claims $VERSION."
            echo "Nothing downstream can tell these apart: status is the only version the engine"
            echo "reports about itself, so an artifact recorded against this release would carry"
            echo "the wrong engine. Refusing to publish."
            exit 1
          fi
      - name: Generate SHASUMS.txt
        # Asset names only, with sha256sum's two-space separator, so
        # `sha256sum -c SHASUMS.txt` works as-is next to the downloaded files.
        working-directory: release/assets
        run: |
          set -euo pipefail
          sha256sum -- * > ../SHASUMS.txt
          mv ../SHASUMS.txt SHASUMS.txt
          cat SHASUMS.txt
      - name: Extract release notes from CHANGELOG
        run: bash scripts/extract-changelog.sh "$VERSION" > release/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  # NOTHING IS PUBLISHED FROM A COMMIT CI HAS NOT PASSED.
  #
  # v2.0.1 shipped on 28 Sep 2026 with no CI run at all. It was tagged on the
  # v2.0.x branch, which CI does not run on, and this file built and published
  # it regardless. v2.1.0 raced its CI run instead: the tag came three seconds
  # after the push to main on 23 Oct, CI passed ten minutes later, and nothing
  # here would have stopped the release had it failed.
  #
  # The four required checks are looked up on the tagged commit by exact name,
  # and only CI's runs for a push of that commit to main count: a check run
  # must belong to a check suite GitHub Actions (app 15368) created with
  # head_branch main and the commit as `after`. A pull request run does not
  # count. GitHub reports it on the head commit, but it built and tested that
  # commit merged with main as main then was, which is another tree whenever
  # main had moved on. A fork's pull request suite has no `after`, even from a
  # branch the fork calls main. The newest counted run of each check must have
  # concluded success. One still running is polled once a minute for up to 90
  # minutes, and one that failed stops the release at once. A commit that
  # never reached main, a backport branch included, is never published.
  ci-green:
    if: github.ref_type == 'tag'
    timeout-minutes: 100
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The tagged commit passed the required CI checks
        shell: bash
        run: |
          set -euo pipefail
          # Exactly as GitHub names them. A job renamed in ci.yml has to be
          # renamed here too, or every release waits out the deadline.
          required=(
            "build (ubuntu-latest)"
            "lean / certificate checker"
            "SHACL conformance vs the W3C suite"
            "python (open-ontologies-lite)"
          )
          minutes=90
          # The ids, as a JSON array, of the check suites GitHub Actions
          # created for a push of this commit to main. A tag push and a pull
          # request run get suites under their own tag or branch name.
          push_suites() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-suites?app_id=15368&per_page=100" \
              | jq -cs --arg sha "$GITHUB_SHA" \
                  '[.[].check_suites[] | select(.head_branch == "main" and .after == $sha) | .id]'
          }
          # "<passed|failed|running|missing> <conclusion or status> <url>" for
          # the newest run under this exact name in one of the suites in $2.
          # The newest decides, so a re-run still going is waited for, and a
          # re-run that failed counts even where an older run passed.
          newest() {
            local enc
            enc=$(jq -rn --arg n "$1" '$n | @uri')
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$enc&filter=all&per_page=100" \
              | jq -rs --arg n "$1" --argjson suites "$2" '
                  [.[].check_runs[]
                   | select(.name == $n and .app.slug == "github-actions" and (.check_suite.id | IN($suites[])))]
                  | max_by(.id)
                  | if . == null then "missing - -"
                    elif .status != "completed" then "running \(.status) \(.html_url)"
                    elif .conclusion == "success" then "passed success \(.html_url)"
                    else "failed \(.conclusion) \(.html_url)" end'
          }
          deadline=$(( $(date +%s) + minutes * 60 ))
          unanswered=0
          while :; do
            passed=() waiting=() failed=() api_failed=false
            # Fails closed: with no suite list nothing can pass this round, and
            # five unreadable rounds in a row fail the job below.
            if ! suites=$(push_suites 2>"$RUNNER_TEMP/check-suites.err"); then
              api_failed=true
              echo "::warning::could not read the check suites on $GITHUB_SHA: $(tr '\n' ' ' <"$RUNNER_TEMP/check-suites.err")"
              for name in "${required[@]}"; do
                waiting+=("'$name' could not be matched to a push to main, because the check suites could not be read")
              done
            else
              for name in "${required[@]}"; do
                if ! state=$(newest "$name" "$suites" 2>"$RUNNER_TEMP/check-runs.err"); then
                  api_failed=true
                  echo "::warning::could not read the check runs named '$name': $(tr '\n' ' ' <"$RUNNER_TEMP/check-runs.err")"
                  waiting+=("'$name' could not be read from the API")
                  continue
                fi
                read -r kind detail url <<<"$state"
                case "$kind" in
                  passed) passed+=("'$name' passed: $url") ;;
                  failed) failed+=("'$name' concluded $detail: $url") ;;
                  running) waiting+=("'$name' is $detail: $url") ;;
                  *) waiting+=("'$name' has no run from CI for a push of this commit to main") ;;
                esac
              done
            fi
            if [ "${#failed[@]}" -gt 0 ]; then
              printf '::error::%s\n' "${failed[@]}"
              echo "::error::Refusing to publish $GITHUB_REF_NAME from $GITHUB_SHA. Re-run what failed in CI, and re-run this job once it passes."
              exit 1
            fi
            if [ "${#waiting[@]}" -eq 0 ]; then
              printf '%s\n' "${passed[@]}"
              exit 0
            fi
            if $api_failed; then unanswered=$((unanswered + 1)); else unanswered=0; fi
            if [ "$unanswered" -ge 5 ]; then
              echo "::error::Refusing to publish $GITHUB_REF_NAME: the check suites or check runs could not be read in five rounds running."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              for w in "${waiting[@]}"; do echo "::error::after $minutes minutes, $w"; done
              echo "::error::Refusing to publish $GITHUB_REF_NAME from $GITHUB_SHA. Push that commit to main, and re-run this job once CI has passed on the push; a pull request run does not count."
              exit 1
            fi
            printf -v line '%s; ' "${waiting[@]}"
            echo "$(date -u +%H:%M:%S) waiting: ${line%; }"
            sleep 60
          done

  publish:
    if: needs.verify-version.outputs.publish == 'true'
    needs: [verify-version, assemble, ci-green]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # attest-build-provenance signs through Sigstore with the workflow's OIDC
      # identity and writes the attestation back to the repository, so it needs
      # both on top of contents: write.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: The assets are the ones assemble checked
        working-directory: release/assets
        run: sha256sum -c SHASUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Each subject is named as the asset it is published under.
          subject-path: |
            release/assets/open-ontologies-*
            release/assets/oo-*
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release/notes.md
          prerelease: ${{ needs.verify-version.outputs.prerelease }}
          make_latest: ${{ needs.verify-version.outputs.latest }}
          fail_on_unmatched_files: true
          files: release/assets/*

  # The ghcr image, published only once the GitHub release exists. It used to be
  # pushed by the Docker workflow on the same tag, in parallel with this one and
  # waiting for nothing, so a release that failed still moved :latest.
  #
  # Built from the tagged tree with no cache, smoke-tested, asked its version,
  # and then pushed by a second build on the same builder, which reuses the
  # layers just tested. The Docker workflow builds and runs the same image on
  # every pull request that touches it, with the same two checks.
  image:
    if: needs.verify-version.outputs.publish == 'true'
    needs: [verify-version, publish]
    timeout-minutes: 75
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/edge
          sudo apt-get clean
          df -h
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image from the tagged tree, with no cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          no-cache: true
          tags: open-ontologies:release
      - name: Smoke test (binary starts, all shared libs resolve)
        run: docker run --rm open-ontologies:release --help
      - name: The image reports the version of its release
        run: |
          set -euo pipefail
          # An explicit data dir, so the answer does not depend on HOME being
          # writable inside the distroless image: `status` creates its store.
          got=$(docker run --rm open-ontologies:release --no-connect --data-dir /tmp/oo status \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "release $VERSION; the image reports $got"
          [ "$got" = "$VERSION" ] || { echo "::error::the image reports $got and the release claims $VERSION"; exit 1; }
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ needs.verify-version.outputs.latest }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
