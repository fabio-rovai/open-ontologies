<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>
    .bg    { fill: #0b1020; }
    .card  { fill: #111827; stroke: #1f2937; stroke-width: 1; }
    .cls   { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
    .ind   { fill: #172554; stroke: #3b82f6; stroke-width: 1.5; }
    .lbl   { fill: #e5e7eb; font-size: 13px; }
    .lblb  { fill: #f8fafc; font-size: 13px; font-weight: 600; }
    .asserted { stroke: #64748b; stroke-width: 2; fill: none; }
    .derived  { stroke: #22c55e; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .edgelbl  { fill: #94a3b8; font-size: 11px; }
    .rulelbl  { fill: #22c55e; font-size: 11px; font-weight: 700; }
    .title    { fill: #f8fafc; font-size: 15px; font-weight: 700; }
    .sub      { fill: #94a3b8; font-size: 11.5px; }
    .ok       { fill: #22c55e; font-size: 12.5px; font-weight: 700; }
    .mono     { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #cbd5e1; }
    .key      { fill: #94a3b8; font-size: 11px; }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="520" rx="10"/>

  <text class="title" x="28" y="34">Which suppliers need enhanced due diligence?</text>
  <text class="sub"   x="28" y="54">Grey edges you asserted. Green edges the engine derived.</text>

  <!-- ── class chain ── -->
  <rect class="cls" x="150" y="88" width="196" height="38" rx="8"/>
  <text class="lbl" x="166" y="112">ex:SanctionedJurisdiction</text>

  <rect class="cls" x="150" y="188" width="196" height="38" rx="8"/>
  <text class="lbl" x="166" y="212">ex:HighRiskSupplier</text>

  <rect class="cls" x="126" y="288" width="244" height="38" rx="8"/>
  <text class="lblb" x="142" y="312">ex:NeedsEnhancedDueDiligence</text>

  <!-- ── individual ── -->
  <rect class="ind" x="470" y="88" width="136" height="38" rx="8"/>
  <text class="lblb" x="488" y="112">ex:Northwind</text>

  <!-- ── asserted ── -->
  <path class="asserted" d="M248,126 L248,188" marker-end="url(#grey)"/>
  <text class="edgelbl" x="256" y="161">rdfs:subClassOf</text>

  <path class="asserted" d="M248,226 L248,288" marker-end="url(#grey)"/>
  <text class="edgelbl" x="256" y="261">rdfs:subClassOf</text>

  <path class="asserted" d="M470,107 L346,107" marker-end="url(#grey)"/>
  <text class="edgelbl" x="380" y="99">rdf:type</text>

  <!-- ── derived ── -->
  <path class="derived" d="M506,126 C506,160 430,198 350,205" marker-end="url(#green)"/>
  <text class="rulelbl" x="418" y="152">rdfs9</text>

  <path class="derived" d="M556,126 C592,230 500,306 376,307" marker-end="url(#green)"/>
  <text class="rulelbl" x="494" y="230">rdfs9</text>

  <path class="derived" d="M150,110 C88,142 88,268 122,302" marker-end="url(#green)"/>
  <text class="rulelbl" x="36" y="210">rdfs11</text>

  <!-- ── verdict strip ── -->
  <rect class="card" x="28" y="362" width="704" height="128" rx="10"/>
  <text class="ok"  x="50" y="390">&#10003; certificate accepted</text>
  <text class="sub" x="214" y="390">by a Lean 4 proof, not by the engine that produced it</text>

  <text class="mono" x="50" y="420">$ lake exe oo-cert cert/asserted.tsv cert/derivations.tsv</text>
  <text class="mono" x="50" y="442">{"ok": true, "asserted": 4, "derivations": 3,</text>
  <text class="mono" x="50" y="460"> "theorem": "OOCert.certificate_sound"}</text>

  <text class="key" x="50" y="482">Forge one line and it exits 1, naming the rule that failed and printing its premises.</text>

  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>
</svg>
