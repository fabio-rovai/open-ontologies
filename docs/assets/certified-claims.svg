<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#070d20"/></linearGradient></defs>
<rect width="1100" height="430" rx="14" fill="url(#bg)"/>
<text x="34" y="40" font-size="17" font-weight="800" fill="#e2e8f0">Three claims that used to travel on trust</text>
<text x="34" y="60" font-size="11.5" fill="#64748b">each column is a real run; every number here is read from its output, never typed</text>
<rect x="34" y="84" width="332" height="280" rx="11" fill="#0b1428" stroke="#1e3a5f" stroke-width="1"/>
<text x="50" y="110" font-size="11.5" font-weight="800" letter-spacing="0.6" fill="#7dd3fc">A CROSSWALK'S MATCH TYPE</text>
<text x="50" y="126" font-size="10" fill="#64748b">claimed, then checked against what each side entails</text>
<text x="50" y="154" font-size="10.5" fill="#e2e8f0">Person</text>
<text x="350" y="154" font-size="10" text-anchor="end" fill="#fbbf24">exactMatch → relatedMatch</text>
<text x="50" y="171" font-size="10.5" fill="#e2e8f0">Organisation</text>
<text x="350" y="171" font-size="10" text-anchor="end" fill="#fbbf24">exactMatch → relatedMatch</text>
<text x="50" y="188" font-size="10.5" fill="#e2e8f0">Entity</text>
<text x="350" y="188" font-size="10" text-anchor="end" fill="#34d399">exactMatch → exactMatch</text>
<text x="50" y="205" font-size="10.5" fill="#e2e8f0">Event</text>
<text x="350" y="205" font-size="10" text-anchor="end" fill="#34d399">exactMatch → exactMatch</text>
<line x1="50" y1="216" x2="350" y2="216" stroke="#1e3a5f"/>
<text x="50" y="234" font-size="10" fill="#94a3b8">1 term the crosswalk does not carry</text>
<text x="58" y="249" font-size="10" fill="#64748b">· ResponsibleActor</text>
<text x="50" y="275" font-size="10" fill="#fbbf24">the target has no word for ies:ResponsibleActor, so</text>
<text x="50" y="289" font-size="10" fill="#fbbf24">nothing stronger is defensible</text>
<rect x="384" y="84" width="332" height="280" rx="11" fill="#0b1428" stroke="#1e3a5f" stroke-width="1"/>
<text x="400" y="110" font-size="11.5" font-weight="800" letter-spacing="0.6" fill="#7dd3fc">CONTEXTS THAT DISAGREE</text>
<text x="400" y="126" font-size="10" fill="#64748b">each module reasons alone; a fact earns “true everywhere”</text>
<rect x="400" y="146" width="300" height="24" rx="7" fill="#060e20" stroke="#1e3a5f"/>
<text x="410" y="162" font-size="10.5" fill="#e2e8f0">birds</text>
<text x="690" y="162" font-size="10" text-anchor="end" fill="#64748b">entails 3</text>
<rect x="400" y="178" width="300" height="24" rx="7" fill="#060e20" stroke="#1e3a5f"/>
<text x="410" y="194" font-size="10.5" fill="#e2e8f0">penguins</text>
<text x="690" y="194" font-size="10" text-anchor="end" fill="#64748b">entails 4</text>
<rect x="400" y="210" width="300" height="24" rx="7" fill="#060e20" stroke="#1e3a5f"/>
<text x="410" y="226" font-size="10.5" fill="#e2e8f0">field_guide</text>
<text x="690" y="226" font-size="10" text-anchor="end" fill="#64748b">entails 3</text>
<text x="400" y="260" font-size="10.5" font-weight="700" fill="#34d399">1 fact entailed in 2 of 3 modules</text>
<text x="400" y="277" font-size="10" fill="#94a3b8">8 held by fewer, and named rather than dropped</text>
<text x="400" y="301" font-size="10" fill="#fb3b53">one graph holding both is inconsistent; kept apart, both</text>
<text x="400" y="315" font-size="10" fill="#fb3b53">are fine</text>
<rect x="734" y="84" width="332" height="280" rx="11" fill="#0b1428" stroke="#1e3a5f" stroke-width="1"/>
<text x="750" y="110" font-size="11.5" font-weight="800" letter-spacing="0.6" fill="#7dd3fc">A NUMBER</text>
<text x="750" y="126" font-size="10" fill="#64748b">recomputed from the definition, in Lean</text>
<text x="750" y="158" font-size="10.5" fill="#94a3b8">A × B = C &#160;&#160;2×3 · 3×2</text>
<text x="750" y="182" font-size="9" letter-spacing="0.5" fill="#64748b">COST</text>
<text x="808" y="182" font-size="9" letter-spacing="0.5" fill="#64748b">VERDICT</text>
<text x="1050" y="182" font-size="9" letter-spacing="0.5" text-anchor="end" fill="#64748b">THEOREM</text>
<line x1="750" y1="190" x2="1050" y2="190" stroke="#1e3a5f"/>
<text x="750" y="208" font-size="9.5" fill="#64748b">O(n³)</text>
<text x="808" y="208" font-size="10" fill="#34d399">product_checked</text>
<text x="1050" y="208" font-size="9" text-anchor="end" fill="#34d399">MatCert.mul_of_check</text>
<text x="750" y="224" font-size="9" fill="#64748b">recompute, integers</text>
<text x="750" y="244" font-size="9.5" fill="#64748b">O(n²)</text>
<text x="808" y="244" font-size="10" fill="#7dd3fc">survived, 2⁻⁴⁰</text>
<text x="1050" y="244" font-size="9" text-anchor="end" fill="#64748b">none</text>
<text x="750" y="260" font-size="9" fill="#64748b">Freivalds, integers</text>
<text x="750" y="280" font-size="9.5" fill="#64748b">O(n²)</text>
<text x="808" y="280" font-size="10" fill="#fbbf24">within tolerance</text>
<text x="1050" y="280" font-size="9" text-anchor="end" fill="#64748b">none</text>
<text x="750" y="296" font-size="9" fill="#64748b">Freivalds, doubles</text>
<line x1="34" y1="380" x2="1066" y2="380" stroke="#1e3a5f"/>
<text x="34" y="398" font-size="10" fill="#64748b">A word here is this engine's unless a checker earned it. Only the top row of the right column names a theorem, and only because oo-matcert exited zero having printed it.</text>
</svg>